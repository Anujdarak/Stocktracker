<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prox-fav-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="prox-fav-accent" x1="6" y1="6" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="24" height="24" rx="6" fill="#030712" />

  <!-- Outer Telemetry Horizon Track -->
  <circle
    cx="12"
    cy="12"
    r="8.5"
    stroke="url(#prox-fav-grad)"
    stroke-width="1.5"
    stroke-dasharray="3 2.5"
    opacity="0.45"
  />

  <!-- Dual Interlocking Convergence Arcs (Proximity Radar) -->
  <path
    d="M6 12A6 6 0 0 1 12 6"
    stroke="url(#prox-fav-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M12 18A6 6 0 0 0 18 12"
    stroke="url(#prox-fav-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Ascending Market Breakout Vector -->
  <path
    d="M7.5 16.5L16.5 7.5M16.5 7.5H11.5M16.5 7.5V12.5"
    stroke="url(#prox-fav-accent)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Epicenter Proximity Beacon -->
  <circle cx="12" cy="12" r="2" fill="#34D399" />
  <circle cx="12" cy="12" r="0.8" fill="#FFFFFF" />
</svg>